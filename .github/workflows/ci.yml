name: Synth preservation and review
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: synth-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated device-free review dependencies
        run: python -m pip install -r requirements-review.txt
      - name: Verify original hashes and run all three suites separately
        run: python tools/validate.py
