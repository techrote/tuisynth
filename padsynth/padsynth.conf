# padsynth configuration - manually maintained; the program never rewrites this file.
# Invalid values fall back individually with a diagnostic; conflicting bindings
# are diagnosed. Emergency routes (CTRL+P palette, CTRL+T restore, CTRL+Q quit,
# F10 ribbon, F1 help) cannot be rebound.
schema = "padsynth-config/1.0"

[application]
state_directory = ".padsynth"

[layout]
pads_visible = true
voice_visible = true
mod_visible = true
browser_visible = true
piano_visible = true
left_ratio = 0.24
center_ratio = 0.40
voice_ratio = 0.55
min_width = 14
min_height = 4

[appearance]
theme = "neon-circuitry"
theme_directories = ["themes"]
immersive = false
seed = -1             # -1 respects theme mode; nonnegative values force a seed.
motion = "normal"     # off / reduced / normal / high; host motion policy wins.

[capabilities]
colour_depth = "auto" # auto / truecolour / 256 / 16 / mono
unicode = true
mouse = true
terminal_focus = true

[audio]
sample_rate = 44100
polyphony = 8
audition_seconds = 2.5
master_gain = 0.8
device = "auto"       # auto / sounddevice / winsound / null

[accessibility]
high_contrast = false
reduced_motion = false
ascii_only = false

[session]
restore = true
recovery_seconds = 5
fps = 12
paint_budget = 200000

[bindings]
# Bind non-conflicting key sequences to existing command IDs, e.g.:
# "c-g" = "drone.toggle"
