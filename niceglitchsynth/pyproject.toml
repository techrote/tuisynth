[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "padsynth"
version = "0.1.0"
description = "Mouse-first terminal synthesizer for Windows Terminal - pads, strings, air, ambience."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt_toolkit>=3.0.40",
    "numpy>=1.26",
    "sounddevice>=0.4.6",
    "python-rtmidi>=1.5.0",
]

[project.scripts]
padsynth = "padsynth.__main__:main"

[tool.setuptools]
packages = ["padsynth", "padsynth.engine"]